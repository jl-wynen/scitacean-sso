<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark light" />
    <title>Authenticated</title>
    <script type="application/javascript">
        window.close();
    </script>
    <style>
        :root {
            --color-text: light-dark(#2c2c2c, #d4d4d4);
            --color-primary: light-dark(#BC4849, #FF908D);
            --color-success: light-dark(#218358, #3dd68c);
        }

        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--color-text);
            font-size: 1rem;
        }

        h1 {
            font-size: 2rem;
        }

        footer {
            margin-top: auto;
            width: 100%;
            text-align:center;
            /* TODO border color */
            border-top: 2px solid var(--color-text);

            div {
                padding: 1rem;
            }
        }

        .success {
            color: var(--color-success);
        }

        .failure {
            /* TODO color */
            color: var(--color-primary);
        }

        .emph {
            color: var(--color-primary);
        }

        #scitacean-monochrome-fluke {
            fill: var(--color-text) !important;
        }
    </style>
</head>
<body style="text-align: center;">
    <!-- Noisy background -->
    <svg style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="noiseFilter">
                <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.5"
                        numOctaves="2"
                        stitchTiles="stitch"/>
                <feColorMatrix type="matrix" values="
                0 0 0 0.09 0
                0 0 0 0.09 0
                0 0 0 0.09 0
                0 0 0 1 0"/>
            </filter>
            <pattern id="noisePattern" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
                <rect width="400" height="400" filter="url(#noiseFilter)"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#noisePattern)" opacity="0.15" style="mix-blend-mode: overlay;"/>
    </svg>

    ${content}

    <!-- Scitacean logo -->

</html>
